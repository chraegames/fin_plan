<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=DM+Sans:opsz,wght@9..40,300..700&family=JetBrains+Mono:wght@300..600&display=swap"

    />

    <title>FIRE Planner &mdash; long-horizon retirement projection</title>
    <meta
      name="description"
      content="A free retirement and long-term financial projection tool. Model income, expenses, investments, taxes, and withdrawals over a customizable horizon. Runs entirely in your browser."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Financial Planner &mdash; long-horizon retirement projection" />
    <meta
      property="og:description"
      content="Model income, expenses, investments, taxes, and withdrawals across a customizable horizon. Free, browser-only, no account required."
    />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Financial Planner" />
    <meta
      name="twitter:description"
      content="A free, browser-only retirement projection tool."
    />

    <meta name="robots" content="index, follow" />

    <!--
      Umami analytics (self-hosted, cookie-less). Replace STATS_DOMAIN and
      WEBSITE_ID after standing up the Umami container (see DEPLOY.md Part D).
      If the script fails to load, src/utils/analytics.ts no-ops gracefully.
    -->
    <script
      defer
      src="https://STATS_DOMAIN/script.js"
      data-website-id="WEBSITE_ID"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
